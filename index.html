<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NIR-Tree</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #ddd;
        font: 13px/1.6 system-ui;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #000b;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="ui">
      <b>NIR-Tree</b><br />
      click: insert · drag: range query · hover: point query · right-click: remove<br />
      <button id="cluster">Add 100 points</button>
      <button id="clear">Clear</button>
      <label>Fanout <input id="fanout" type="range" min="2" max="16" value="4" /></label>
      <div id="stats"></div>
    </div>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
